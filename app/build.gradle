plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

def osName = System.getProperty("os.name").toLowerCase()
def lwjglNatives
def imguiNatives

if (osName.contains("win")) {
    lwjglNatives = "natives-windows"
    imguiNatives = "imgui-java-natives-windows"
} else if (osName.contains("mac")) {
    def osArch = System.getProperty("os.arch").toLowerCase()
    lwjglNatives = osArch.contains("aarch64") ? "natives-macos-arm64" : "natives-macos"
    imguiNatives = "imgui-java-natives-macos"
} else if (osName.contains("nix") || osName.contains("nux") || osName.indexOf("aix") > 0) {
    def osArch = System.getProperty("os.arch").toLowerCase()
    lwjglNatives = osArch.contains("aarch64") ? "natives-linux-arm64" : "natives-linux"
    imguiNatives = "imgui-java-natives-linux"
}

configurations.all {
    resolutionStrategy {
        force "org.lwjgl:lwjgl:${libs.versions.lwjgl.get()}"
        force "org.lwjgl:lwjgl-glfw:${libs.versions.lwjgl.get()}"
        force "org.lwjgl:lwjgl-opengl:${libs.versions.lwjgl.get()}"
        force "org.lwjgl:lwjgl-tinyfd:${libs.versions.lwjgl.get()}"
    }
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation libs.guava

    implementation libs.lwjgl
    implementation libs.lwjgl.glfw
    implementation libs.lwjgl.opengl
    implementation libs.lwjgl.tinyfd
    runtimeOnly "org.lwjgl:lwjgl:${libs.versions.lwjgl.get()}:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${libs.versions.lwjgl.get()}:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${libs.versions.lwjgl.get()}:$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd:${libs.versions.lwjgl.get()}:$lwjglNatives"

    implementation libs.joml

    implementation libs.imgui.binding
    implementation libs.imgui.lwjgl3
    runtimeOnly "io.github.spair:${imguiNatives}:${libs.versions.imgui.get()}"

    implementation libs.gson
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'rsim2.App'
}

// Separate launcher keeps GUI/native initialization and logs off MCP stdout.
tasks.register('mcpStartScripts', CreateStartScripts) {
    applicationName = 'rsim2-mcp'
    mainClass = 'rsim2.mcp.McpServer'
    classpath = tasks.named('startScripts').get().classpath
    outputDir = layout.buildDirectory.dir('mcpScripts').get().asFile
}

distributions {
    main {
        contents {
            from(tasks.named('mcpStartScripts')) {
                into 'bin'
            }
        }
    }
}

tasks.named('run') {
    workingDir = rootProject.projectDir
}

test {
    useJUnitPlatform()
}

// Windows Java launchers can decode Gradle's UTF-8 argument file using the
// system code page. Keep the worker classpath ASCII; manifest URLs preserve
// non-ASCII project paths without copying or changing the compiled classes.
if (osName.contains('win') && rootProject.projectDir.absolutePath.any { it > '\u007f' }) {
    def testRuntimeFiles = sourceSets.test.runtimeClasspath
    def testClasspathJar = tasks.register('testClasspathJar', Jar) {
        dependsOn tasks.named('testClasses')
        archiveFileName = 'test-classpath.jar'
        destinationDirectory = new File(gradle.gradleUserHomeDir,
                'caches/rsim2/' + Integer.toHexString(rootProject.projectDir.absolutePath.hashCode()))
        inputs.files(testRuntimeFiles)
        doFirst {
            manifest.attributes('Class-Path': testRuntimeFiles.files
                    .collect { it.toURI().toASCIIString() }.join(' '))
        }
    }
    tasks.named('test') {
        dependsOn testClasspathJar
        classpath = files(testClasspathJar.flatMap { it.archiveFile })
    }
}

tasks.register('testSimToReal', JavaExec) {
    group = 'verification'
    description = 'Runs the SimToRealBridgeTest suite'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'rsim2.SimToRealBridgeTest'
    workingDir = rootProject.projectDir
}

tasks.register('testCollision', JavaExec) {
    group = 'verification'
    description = 'Runs the CollisionDetectionTest suite'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'rsim2.CollisionDetectionTest'
    workingDir = rootProject.projectDir
}

tasks.register('testAiInteraction', JavaExec) {
    group = 'verification'
    description = 'Runs the AiInteractionTest suite'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'rsim2.AiInteractionTest'
    workingDir = rootProject.projectDir
}

tasks.register('testModelImport', JavaExec) {
    group = 'verification'
    description = 'Runs the ModelImportScriptTest suite'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'rsim2.ModelImportScriptTest'
    workingDir = rootProject.projectDir
}
